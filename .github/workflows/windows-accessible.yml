name: Windows (accessible edition)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (MSVC, vcpkg manifest)
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DGuiModule=win32

      - name: Build
        run: cmake --build build --config Release -- -m

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure --timeout 300

      - name: Package
        run: python tools/package.py build/src/Release dist

      - uses: actions/upload-artifact@v4
        with:
          name: ZynAddSubFX-Accessible-win64
          path: dist/*.zip
